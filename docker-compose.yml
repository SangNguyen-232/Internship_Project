services:

  # ─── PostgreSQL Database ────────────────────────────────────
  postgres:
    container_name: iot_postgres
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      # 5433 trên Windows → 5432 trong container (tránh xung đột PostgreSQL cài sẵn trên Windows)
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_root_pass
      POSTGRES_DB: iot_db
    volumes:
      # Lưu data DB vào Docker volume (bền vững qua restart)
      - pgdata:/var/lib/postgresql/data
      # Tự động chạy SQL init khi container tạo lần đầu
      - ./DB/DB.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./DB/auth_migration.sql:/docker-entrypoint-initdb.d/02_auth.sql
    networks:
      - iot_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d iot_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── Node.js Backend ────────────────────────────────────────
  backend:
    container_name: iot_backend
    build:
      context: ./BE
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      # Map port 3000 của container ra Windows host port 3000
      - "3000:3000"
    environment:
      # Trỏ DB_HOST đến tên service "postgres" trong Docker network
      DB_HOST: postgres
      DB_NAME: iot_db
      DB_USER: iot_user
      DB_PASS: "004232"
      DB_PORT: "5432"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - iot_net

networks:
  iot_net:
    driver: bridge

volumes:
  pgdata:
    driver: local